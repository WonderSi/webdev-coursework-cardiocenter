spring:
  application:
    name: cardio-survey

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: always

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Real-IP
      internal-proxies: '(${TRUSTED_PROXY_REGEX:(?!)})'
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

  refresh-token:
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:86400000}
    remember-me-expiration-ms: ${REFRESH_TOKEN_REMEMBER_ME_EXPIRATION_MS:2592000000}

  auth-cookie:
    secure: false

  login-rate-limit:
    window-ms: ${LOGIN_RATE_LIMIT_WINDOW_MS:60000}
    max-attempts-per-ip: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:20}
    max-attempts-per-login: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_LOGIN:5}

  ml-service:
    url: ${ML_SERVICE_URL:http://127.0.0.1:8000}

springdoc:
  default-produces-media-type: application/json
  packages-to-scan: com.medical.cardio.controller
  paths-to-match: /api/**
  override-with-generic-response: false
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
