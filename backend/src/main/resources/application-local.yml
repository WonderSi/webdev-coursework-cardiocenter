# For local Docker development: prod supplies container connection settings,
# and local enables API documentation. Activate in this order: prod,local.
app:
  auth-cookie:
    secure: false

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
