spring:
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Real-IP
      internal-proxies: '(?!)'

logging:
  level:
    com.medical: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1jaS10ZXN0cy1vbmx5LTMyLWJ5dGVz
    expiration-ms: 900000

  refresh-token:
    expiration-ms: 86400000
    remember-me-expiration-ms: 2592000000

  auth-cookie:
    secure: false

  login-rate-limit:
    window-ms: 60000
    max-attempts-per-ip: 20
    max-attempts-per-login: 5

  ml-service:
    url: http://localhost:8000

BOOTSTRAP_SUPER_ADMIN_EMAIL: test-admin@test.com
BOOTSTRAP_SUPER_ADMIN_PASSWORD: test-admin-password
